name: Build Windows executable

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Package executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name Durhack2026 `
            --runtime-hook packaging/pyi_rth_paths.py `
            --add-data "graphics;graphics" `
            --add-data "sounds;sounds" `
            --paths . --paths .. `
            --hidden-import Durhack2026.dhtypes.soundTypes `
            --hidden-import Durhack2026.sounds.sound_effect_dict `
            --hidden-import Durhack2026.functions.SoundEngine `
            --collect-all pygame `
            --collect-all pymunk `
            main.py
      - uses: actions/upload-artifact@v4
        with:
          name: Durhack2026-Windows
          path: dist/Durhack2026.exe
          if-no-files-found: error
          retention-days: 30
